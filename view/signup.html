<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VozUrbana | Criar conta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="auth-page" data-page="signup">
  <main class="container auth-container">
    <section class="auth-card shadow-lg" aria-labelledby="titulo-signup">
      <div class="brand-header mb-4"><span class="brand-symbol"><i class="bi bi-megaphone-fill"></i></span>
        <div><strong>VozUrbana</strong><span>Sua cidade, sua voz.</span></div>
      </div>
      <div class="eyebrow">NOVO CADASTRO</div>
      <h1 id="titulo-signup" class="h2 fw-bold mb-2">Crie sua conta</h1>
      <p class="text-muted mb-4">A data de cadastro é gerada automaticamente pelo servidor.</p>
      <div id="mensagem" role="status" aria-live="polite"></div>
      <form id="signupForm">
        <div class="mb-3"><label for="nome" class="form-label">Nome</label>
          <input class="form-control" id="nome" maxlength="100" required autocomplete="name"></div>
        <div class="mb-3"><label for="email" class="form-label">E-mail</label>
          <input class="form-control" id="email" type="email" maxlength="100" autocomplete="username" required></div>
        <div class="mb-3"><label for="cpf" class="form-label">CPF (11 números)</label>
          <input class="form-control" id="cpf" inputmode="numeric" pattern="[0-9]{11}" maxlength="11" placeholder="Somente números" required></div>
        <div class="mb-4"><label for="senha" class="form-label">Senha (mínimo 6 caracteres)</label>
          <input class="form-control" id="senha" type="password" minlength="6" autocomplete="new-password" required></div>
        <button class="btn btn-primary-custom w-100 py-3" id="btnCadastrar" type="submit"><i class="bi bi-person-plus me-2"></i>Cadastrar</button>
      </form>
      <p class="text-center text-secondary mt-4 mb-0">Já tem conta? <a href="index.html" class="link-accent">Fazer login</a></p>
    </section>
  </main>
</body>
</html>
