<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VozUrbana | Entrar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="auth-page" data-page="login">
  <main class="container auth-container">
    <section class="auth-card shadow-lg" aria-labelledby="titulo-login">
      <div class="brand-header mb-4"><span class="brand-symbol"><i class="bi bi-megaphone-fill"></i></span>
        <div><strong>VozUrbana</strong><span>Sua cidade, sua voz.</span></div>
      </div>
      <div class="eyebrow">ÁREA DO CIDADÃO</div>
      <h1 id="titulo-login" class="h2 fw-bold mb-2">Bem-vindo de volta</h1>
      <p class="text-muted mb-4">Entre para acompanhar suas denúncias com segurança.</p>
      <div id="mensagem" role="status" aria-live="polite"></div>
      <form id="loginForm" autocomplete="on">
        <div class="mb-3"><label for="email" class="form-label">E-mail</label>
          <input id="email" class="form-control form-control-lg" type="email" autocomplete="username" placeholder="voce@email.com" required maxlength="100"></div>
        <div class="mb-4"><label for="senha" class="form-label">Senha</label>
          <input id="senha" class="form-control form-control-lg" type="password" autocomplete="current-password" placeholder="Sua senha" required></div>
        <button class="btn btn-primary-custom w-100 py-3" id="btnEntrar" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Entrar</button>
      </form>
      <p class="text-center text-secondary mt-4 mb-0">Ainda não tem conta? <a href="signup.html" class="link-accent">Cadastre-se</a></p>
    </section>
    <p class="auth-footnote">VozUrbana · AV2 · Spring Security + JWT</p>
  </main>
</body>
</html>
